name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch: # Memungkinkan trigger manual dari GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Build Android APK (Split architecture)
        run: flutter build apk --release --split-per-abi
        
      - name: Build Web Version
        run: flutter build web --release
          
      - name: Upload Android APK (64-bit / HP Baru)
        uses: actions/upload-artifact@v4
        with:
          name: KAI-Tracker-Android-64bit
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload Android APK (32-bit / HP Lama)
        uses: actions/upload-artifact@v4
        with:
          name: KAI-Tracker-Android-32bit
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      - name: Upload Web Version (Bisa untuk iOS/iPhone)
        uses: actions/upload-artifact@v4
        with:
          name: KAI-Tracker-Web
          path: build/web/
